<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - LMS SMK Karya Teladan</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="login-page" data-page="login">
  <section class="login-hero">
    <h1>LMS SMK Karya Teladan</h1>
    <p>Platform pembelajaran digital untuk admin, guru, dan murid. Dibangun dengan PHP Native, REST API, MySQL, dan sistem role access yang jelas.</p>
  </section>

  <main class="login-panel">
    <section class="login-card">
      <h2>Masuk ke Sistem</h2>
      <p class="muted">Gunakan akun sesuai role yang sudah dibuat.</p>

      <div data-alert hidden></div>

      <form data-login-form>
        <div class="form-group">
          <label for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" placeholder="murid@gmail.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" placeholder="Masukkan password" required />
        </div>

        <button class="btn btn-primary" type="submit" data-login-button>Masuk</button>
      </form>
    </section>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
