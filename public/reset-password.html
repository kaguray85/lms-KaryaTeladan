<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - LMS SMK Karya Teladan</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20260608-3" />
</head>
<body class="login-page" data-page="reset-password">
  <section class="login-hero">
    <img class="login-hero-logo" src="assets/img/logo-KaryaTeladan-new.png" alt="Logo SMK Karya Teladan" />
    <h1>LMS SMK Karya Teladan</h1>
  </section>

  <main class="login-panel">
    <section class="login-card">
      <h2>Buat Password Baru</h2>
      <p class="muted">Gunakan minimal 8 karakter dan pastikan kedua password sama.</p>

      <div data-alert hidden></div>

      <form data-reset-password-form>
        <div class="form-group">
          <label for="new-password">Password Baru</label>
          <div class="password-field">
            <input class="form-control" type="password" id="new-password" name="password" placeholder="Masukkan password baru" minlength="8" required />
            <button class="password-toggle" type="button" data-password-toggle data-target="new-password" aria-label="Tampilkan password" aria-pressed="false">
              <span aria-hidden="true">&#128065;</span>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="password-confirmation">Konfirmasi Password Baru</label>
          <div class="password-field">
            <input class="form-control" type="password" id="password-confirmation" name="password_confirmation" placeholder="Ulangi password baru" minlength="8" required />
            <button class="password-toggle" type="button" data-password-toggle data-target="password-confirmation" aria-label="Tampilkan password" aria-pressed="false">
              <span aria-hidden="true">&#128065;</span>
            </button>
          </div>
        </div>

        <button class="btn btn-primary" type="submit" data-submit-button>Simpan Password Baru</button>
      </form>

      <div class="auth-link-row">
        <a href="login.html">Kembali ke halaman login</a>
      </div>
    </section>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/password-reset.js?v=20260612-1"></script>
</body>
</html>
