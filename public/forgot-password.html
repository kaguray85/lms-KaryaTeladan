<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lupa Password - LMS SMK Karya Teladan</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20260608-3" />
</head>
<body class="login-page" data-page="forgot-password">
  <section class="login-hero">
    <img class="login-hero-logo" src="assets/img/logo-KaryaTeladan-new.png" alt="Logo SMK Karya Teladan" />
    <h1>LMS SMK Karya Teladan</h1>
  </section>

  <main class="login-panel">
    <section class="login-card">
      <h2>Lupa Password</h2>
      <p class="muted">Masukkan email akun untuk menerima kode OTP reset password.</p>

      <div data-alert hidden></div>

      <form data-forgot-password-form>
        <div class="form-group">
          <label for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" placeholder="email@gmail.com" required />
        </div>

        <button class="btn btn-primary" type="submit" data-submit-button>Kirim Kode OTP</button>
      </form>

      <div class="auth-link-row">
        <a href="login.html">Kembali ke halaman login</a>
      </div>
    </section>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/password-reset.js?v=20260612-1"></script>
</body>
</html>
